  </script><link rel="stylesheet" href="/study-log/_astro/about.IWAaHvNb.css"></head> <body> <header class="site-header"> <a class="brand" href="/study-log/">study log</a> <span class="spacer"></span> <a class="nav" href="/study-log/status/">교과목 현황</a> <a class="nav" href="/study-log/about/">소개</a> <button class="theme-toggle" type="button" aria-label="테마 전환" data-theme-toggle>◐ 테마</button> </header>  <div class="wrap"> <div class="empty" style="max-width:560px;margin:40px auto"> <div style="font-size:34px">📖</div> <div class="t">아직 발행된 회고가 없습니다</div> <div class="s">첫 교과목이 끝나면 첫 회고가 올라옵니다.</div> </div> </div> <script>
    // 교과목 칩 필터 (ST-02: 0건이면 빈 상태 + 탈출 경로)
    (function () {
      var chips = document.querySelectorAll('[data-filter]');
      var cards = document.querySelectorAll('#cards .postcard');
      var emptyBox = document.getElementById('filter-empty');
      function apply(subject) {
        var visible = 0;
        cards.forEach(function (c) {
          var show = subject === '*' || c.dataset.subject === subject;
          c.style.display = show ? '' : 'none';
          if (show) visible++;
        });
        chips.forEach(function (ch) { ch.classList.toggle('on', ch.dataset.filter === subject); });
        if (emptyBox) emptyBox.hidden = visible > 0;
      }
      chips.forEach(function (ch) { ch.addEventListener('click', function () { apply(ch.dataset.filter); }); });
      var q = new URLSearchParams(location.search).get('subject');
      if (q) apply(q);
    })();
  </script>  <footer class="site-footer">
study log — 학습 회고록. 원고·디자인: <span class="mono">study-blog</span> 저장소에서 관리.
</footer> <script>
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-theme-toggle]');
      if (!b) return;
      var root = document.documentElement;
      var dark = root.getAttribute('data-theme') === 'dark' ||
        (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
      var next = dark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (err) {}
    });
  </script> </body> </html>
